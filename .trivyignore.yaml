# Excepciones ACOTADAS del escáner IaC (Trivy config, severidad HIGH/CRITICAL).
#
# No es una allowlist global: cada entrada identifica un único ID de política y una
# ruta concreta, y lleva justificación. Cualquier otro hallazgo HIGH/CRITICAL hace
# fallar el job. Revisar en cada Gate de infraestructura.
misconfigurations:
  - id: AWS-0054
    paths:
      - "modules/balanceo/main.tf"
    statement: >-
      D2 ratificada por el responsable (RFC-005-ENMIENDA_I030_TLS_D2): CloudFront
      termina HTTPS y el tramo CloudFront -> VPC Origin -> ALB interno es HTTP
      privado de red. No es TLS extremo a extremo; H-01 sigue ABIERTO y la decisión
      pertenece a I-030, no a I-080.

  - id: AWS-0132
    paths:
      - "bootstrap/main.tf"
    statement: >-
      I-070: el state usa SSE-S3 (AES256) en lugar de CMK de KMS porque una CMK
      tiene coste fijo no presupuestado en I-000. Límite declarado como
      ACEPTADO_CON_LIMITE en el Gate I-070 y su matriz de state; sin revocación
      criptográfica inmediata.

  - id: AWS-0011
    paths:
      - "modules/balanceo/main.tf"
    expired_at: 2026-12-02T00:00:00Z
    statement: >-
      RFC-006-EXCEPCION_WAF_I030 APROBADA el 2026-11-08 con
      APRUEBO_RFC_006_WAF_TEMPORAL. Aceptación TEMPORAL del riesgo HIGH de operar
      CloudFront sin WAF: coste WAF no presupuestado en I-000, controles
      compensatorios existentes, caducidad 2026-12-02 o Gate de despliegue AWS.
      No autoriza desplegar AWS ni implementar WAF. Al caducar, Trivy vuelve a
      fallar y se requiere nueva decisión humana.
