# Configuración de gitleaks para Nexum-Backend (A-100).
# Se usan las reglas por defecto SIN exclusiones por ruta: una allowlist de ruta
# oculta cualquier credencial en ese archivo. Los falsos positivos históricos se
# gestionan con un baseline revisado (`.gitleaks-baseline.json`), que suprime
# hallazgos concretos y sigue detectando credenciales nuevas.
#
# Excepción acotada (I-030, 2026-11-06; endurecida 2026-11-07, ampliada 2026-11-07):
# el manifiesto de integridad contiene líneas del tipo
#   "sdd/_control/H08/RFC-004-SECRETOS_BOOTSTRAP.md": "<sha256>"
#   "sdd/_control/H08/ROTACION_SECRETOS_I060.md": "<sha256>"
# y la regla `generic-api-key` las interpreta como clave/valor por la palabra
# «SECRETOS» del nombre del documento. El patrón admite cualquier documento de
# control cuyo nombre contenga SECRETOS, pero exige la ruta exacta del manifiesto
# y la forma exacta de línea con digest de 64 hex.
#
# La excepción se declara DENTRO de la regla `generic-api-key` (no global) y exige
# `condition = "AND"`: deben cumplirse a la vez la ruta exacta del manifiesto y la
# forma exacta de esa línea con un digest de 64 hex. Con la condición por defecto
# («OR») bastaba la ruta para ignorar *todos* los hallazgos del archivo
# (`checkCommitOrPathAllowed`, gitleaks v8.30.1); con «AND» sólo se descartan esas
# líneas concretas y cualquier otra credencial del mismo archivo se detecta.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Digest SHA-256 de documentos de control con SECRETOS en el nombre, dentro del manifiesto de integridad (no son credenciales)"
condition = "AND"
paths = ['''^sdd/_control/H07/BASELINE_SHA256\.json$''']
regexTarget = "line"
regexes = ['''"sdd/_control/H08/[A-Za-z0-9_.-]*SECRETOS[A-Za-z0-9_.-]*\.md":\s*"[a-f0-9]{64}"''']
