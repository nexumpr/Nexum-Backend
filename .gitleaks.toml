# Configuración de gitleaks para Nexum-Backend (A-100).
# Se usan las reglas por defecto SIN exclusiones por ruta: una allowlist de ruta
# oculta cualquier credencial en ese archivo. Los falsos positivos históricos se
# gestionan con un baseline revisado (`.gitleaks-baseline.json`), que suprime
# hallazgos concretos y sigue detectando credenciales nuevas.
#
# Excepción acotada (I-030, 2026-11-06; endurecida 2026-11-07; generalizada 2026-11-08):
# `BASELINE_SHA256.json` es un manifiesto generado en el que **todas** las entradas
# tienen la forma `"<ruta>": "<sha256>"`. La regla `generic-api-key` interpreta
# algunas de esas líneas como clave/valor cuando la ruta contiene palabras como
# «SECRETOS» o «access» (p. ej. RFC-004-SECRETOS_BOOTSTRAP.md o
# terraform-state-access.json.tftpl) y el valor es un digest de 64 hex.
#
# La excepción se declara DENTRO de la regla `generic-api-key` (no global) y exige
# `condition = "AND"`: ruta exacta del manifiesto **y** línea con el formato exacto
# `"<ruta>": "<64 hex>"`. No se excluye ninguna otra regla ni ningún otro archivo,
# y un valor que no sea un SHA-256 de 64 hex sigue generando hallazgo. Además el
# validador SDD recalcula cada hash: un valor arbitrario rompería la integridad.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Entradas del manifiesto de integridad: ruta + digest SHA-256 de 64 hex, no credenciales"
condition = "AND"
paths = ['''^sdd/_control/H07/BASELINE_SHA256\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_./\\-]+":\s*"[a-f0-9]{64}"\s*,?$''']

[[rules.allowlists]]
description = "Constante de estado BLOQUEADO_RFC004 en archivos de prueba nombrados uno a uno (falso positivo del commit 3f45f16)"
condition = "AND"
paths = [
  '''^tests/infra/operacion/test_nexum_operacion\.py$''',
  '''^tests/infra/respaldo/test_backup_restore\.py$''',
]
regexTarget = "secret"
regexes = ['''^BLOQUEADO_RFC004$''']

[[rules.allowlists]]
description = "Contrasena sintetica de pruebas E001 (valor literal, no credencial real; rutas y valor exactos)"
condition = "AND"
paths = [
  '''^tests/integration/register_http_test\.go$''',
  '''^tests/security/register_adversarial_test\.go$''',
  '''^tests/unit/transport/register_handler_test\.go$''',
  '''^tests/unit/application/register_service_test\.go$''',
]
regexTarget = "secret"
regexes = ['''^ExamplePassphrase#2026$''']
