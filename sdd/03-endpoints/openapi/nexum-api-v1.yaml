components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT de corta vigencia; sesión/revocación verificadas en servidores.
  schemas:
    Accepted:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          example: accepted
          enum:
          - accepted
        requestId: &id001
          type: string
          example: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
          format: uuid
      required:
      - status
      - requestId
      description: Contrato formal Nexum Accepted
    AuthTokens:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          example: REDACTED_ACCESS_TOKEN
          minLength: 1
        refreshToken:
          type: string
          example: REDACTED_REFRESH_TOKEN
          minLength: 1
        tokenType:
          type: string
          example: Bearer
          enum:
          - Bearer
        expiresIn:
          type: integer
          example: 900
          minimum: 60
          maximum: 3600
        sessionId: *id001
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - sessionId
      description: Contrato formal Nexum AuthTokens
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          example: Leonardo Prueba
          minLength: 1
          maxLength: 100
          description: Nombre del titular (signupName del prototipo). Sustituye a displayName
            en el contrato publico de E001; el almacenamiento conserva displayName.
        email: &id002
          type: string
          example: ejemplo@example.invalid
          format: email
          maxLength: 254
        password:
          type: string
          example: ExamplePassphrase#2026
          minLength: 12
          maxLength: 128
        income:
          $ref: '#/components/schemas/RegisterIncomeInput'
        recurringExpenses:
          type: array
          maxItems: 94
