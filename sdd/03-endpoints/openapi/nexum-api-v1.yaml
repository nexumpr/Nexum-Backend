                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: DEPENDENCY_UNAVAILABLE
                  message: Solicitud no completada.
                  traceId: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
                  details: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Leonardo Prueba
              email: registro.v602@example.com
              password: ExamplePassphrase#2026
              income:
                amount: '12000.00'
                frequency: monthly
              recurringExpenses:
              - concept: Internet
                amount: '699.00'
                frequency: monthly
                category: Servicios
                type: fixed
              - concept: Transporte
                amount: '300.00'
                frequency: weekly
                category: Transporte
                type: fixed
              privacy:
                accepted: true
                noticeVersion: '2026-11'
              client:
                locale: es-MX
                timeZone: America/Mexico_City
