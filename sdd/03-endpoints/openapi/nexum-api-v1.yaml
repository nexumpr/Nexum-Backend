openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Nexum Backend API — diseño contractual H06
  version: 1.0.0-draft
  description: 75 operaciones E001-E075 derivadas del inventario aprobado H04. Contratos DOCUMENTALES sujetos al Gate H06; sin servicios
    reales desplegados.
servers:
- url: https://api.example.invalid
  description: URL de documentación únicamente; la URL real se configura mediante IaC al desplegar H08.
tags:
- name: identidad
  description: Dominio identidad
- name: usuario-privacidad
  description: Dominio usuario-privacidad
- name: catalogos
  description: Dominio catalogos
- name: finanzas
  description: Dominio finanzas
- name: movimientos
  description: Dominio movimientos
- name: recurrentes
  description: Dominio recurrentes
- name: metas-aportaciones
  description: Dominio metas-aportaciones
- name: presupuestos
  description: Dominio presupuestos
- name: analitica
  description: Dominio analitica
- name: notificaciones
  description: Dominio notificaciones
- name: soporte-opcional
  description: Dominio soporte-opcional
paths:
  /api/v1/auth/register:
    post:
      tags:
      - identidad
      operationId: nexum_e001
      summary: Registrar usuario y consentimiento inicial
      description: 'E001 · Registro atomico V6.0.2: identidad, ingreso habitual, compromisos
        fijos iniciales, consentimiento sellado por el servidor y estado inicial de onboarding
        en una sola transaccion DynamoDB. Sustituye de forma intencional al contrato anterior
        de E001 (RFC-012).'
      x-nexum-catalog-id: E001
      x-nexum-source-class: M
      x-nexum-implementation-scope: REQUIRED_DESIGN
      x-nexum-contract-version: V6.0.2
      x-nexum-responsible-rfc: RFC-012
      x-nexum-data-access: DynamoDB user scoped; no Scan; ver DYNAMODB_ACCESOS_H06.md
      security: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID/clave aleatoria por operación, aislada por usuario y hash del payload; expira según política.
        schema:
          type: string
          minLength: 16
          maxLength: 128
        example: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
      responses:
        '201':
          description: Creado. Registro atomico de identidad, ingreso habitual, compromisos
            fijos, consentimiento y estado inicial de onboarding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                user:
                  id: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
                  name: Leonardo Prueba
                  email: registro.v602@example.com
                  emailVerified: false
                  createdAt: '2026-11-10T12:00:00Z'
                income:
                  amount: '12000.00'
                  frequency: monthly
                  monthlyEquivalent: '12000.00'
                recurringPayments:
                - id: 018f90ef-08e5-4a68-b09f-000000000101
                  concept: Internet
                  amount: '699.00'
                  frequency: monthly
                  category: Servicios
                  type: fixed
                - id: 018f90ef-08e5-4a68-b09f-000000000102
                  concept: Transporte
                  amount: '300.00'
                  frequency: weekly
                  category: Transporte
                  type: fixed
                consent:
                  noticeVersion: '2026-11'
                  acceptedAt: '2026-11-10T12:00:00Z'
                  acceptedByServer: true
                onboarding:
                  microphone: pending
                  notifications: pending
                  configured: false
          headers:
            Location:
              description: Ubicación del recurso creado, si aplica.
              schema:
                type: string
        '400':
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INVALID_REQUEST
                  message: Solicitud no completada.
                  traceId: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
                  details: []
        '409':
          description: CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: CONFLICT
                  message: Solicitud no completada.
                  traceId: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
                  details: []
        '422':
          description: BUSINESS_RULE_VIOLATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BUSINESS_RULE_VIOLATION
                  message: Solicitud no completada.
                  traceId: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
                  details: []
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Solicitud no completada.
                  traceId: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
                  details: []
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Solicitud no completada.
                  traceId: 018f90ef-08e5-7a68-b09f-2b67a47c92f0
                  details: []
        '503':
