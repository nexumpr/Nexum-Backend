name: CD Backend (manual, con autorizacion)

# I-090 — promocion manual de un artefacto verificado. NO se ejecuta en PR ni en push.
# Requiere: workflow_dispatch en main, entorno protegido `aws-deploy` con revisores,
# CD_HABILITADO=true, ENVIRONMENT_PROTECTION_CONFIRMED=aws-deploy, run de CI verde
# del SHA exacto, frase AUTORIZO_DESPLIEGUE_<sha>, artefacto binario-<sha> y LT con
# el release. Sin credenciales estaticas, sin terraform, sin Docker.
#
# Inputs no confiables se transportan SIEMPRE por variables de entorno y se validan
# antes de usarse; nunca se interpolan dentro de scripts shell.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release inmutable (vX.Y.Z+<sha12>)"
        required: true
        type: string
      sha:
        description: "SHA completo de 40 hex del commit a desplegar"
        required: true
        type: string
      run_id:
        description: "Run de Go Backend CI que produjo binario-<sha>"
        required: true
        type: string
      sha256_binario:
        description: "SHA-256 del binario linux/arm64 (64 hex)"
        required: true
        type: string
      autorizacion:
        description: "Frase exacta AUTORIZO_DESPLIEGUE_<sha>"
        required: true
        type: string
      lt_version:
        description: "Version del Launch Template que contiene este release (creada por I-020)"
        required: true
        type: string
      lt_version_previa:
        description: "Version previa conocida (solo se usa como comprobacion; se lee la real de AWS)"
        required: false
        default: ""
        type: string
      confirmar:
        description: "Escribir SI para confirmar el despliegue manual"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-backend-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight de release
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.CD_HABILITADO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      IN_RELEASE_ID: ${{ inputs.release_id }}
      IN_SHA: ${{ inputs.sha }}
      IN_RUN_ID: ${{ inputs.run_id }}
      IN_DIGEST: ${{ inputs.sha256_binario }}
      IN_AUTORIZACION: ${{ inputs.autorizacion }}
      IN_LT_VERSION: ${{ inputs.lt_version }}
      IN_CONFIRMAR: ${{ inputs.confirmar }}
      CD_HABILITADO: ${{ vars.CD_HABILITADO }}
      ENV_CONFIRMADO: ${{ vars.ENVIRONMENT_PROTECTION_CONFIRMED }}
    steps:
      - name: Checkout del SHA autorizado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Validar autorizacion, version y confirmacion
        run: |
          python3 herramientas/verificar_autorizacion_despliegue.py \
            --sha "$IN_SHA" \
            --release-id "$IN_RELEASE_ID" \
            --frase "$IN_AUTORIZACION" \
            --confirmar "$IN_CONFIRMAR" \
            --habilitado "$CD_HABILITADO" \
            --sha256-binario "$IN_DIGEST" \
            --total-nodos 2 \
            --lt-version "$IN_LT_VERSION"

      - name: Verificar run de CI verde, del workflow y SHA autorizados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/$IN_RUN_ID" > run.json
          gh api "repos/${{ github.repository }}/actions/runs/$IN_RUN_ID/artifacts" > artefactos.json
          python3 herramientas/verificar_run_ci.py run.json "$IN_SHA" \
            --workflow-path .github/workflows/go-backend.yml \
            --evento push \
            --rama main \
            --artefactos-json artefactos.json \
            --artefactos "binario-$IN_SHA,sbom-spdx-$IN_SHA"

      - name: Verificar entorno protegido con revisores (falla cerrado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$ENV_CONFIRMADO" = "aws-deploy"
          gh api "repos/${{ github.repository }}/environments/aws-deploy" > entorno.json
          python3 herramientas/verificar_entorno_protegido.py entorno.json

      - name: Descargar binario del run de CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binario-${{ inputs.sha }}
          path: artefacto
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verificar integridad del binario
        run: |
          test -f artefacto/nexum-backend-linux-arm64
          test "$(sha256sum artefacto/nexum-backend-linux-arm64 | cut -d' ' -f1)" = "$IN_DIGEST"

      - name: Descargar SBOM del mismo run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-spdx-${{ inputs.sha }}
          path: artefacto/sbom
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publicar artefacto verificado para el despliegue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verificado-${{ inputs.sha }}
          path: artefacto/
          retention-days: 3
          if-no-files-found: error

  despliegue:
    name: Despliegue ASG con release verificado y rollback
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-deploy
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      ASG_NAME: ${{ vars.ASG_NAME }}
      LT_NAME: ${{ vars.LAUNCH_TEMPLATE_NAME }}
      TG_ARN: ${{ vars.TARGET_GROUP_ARN }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      IN_RELEASE_ID: ${{ inputs.release_id }}
      IN_SHA: ${{ inputs.sha }}
      IN_DIGEST: ${{ inputs.sha256_binario }}
      IN_LT_VERSION: ${{ inputs.lt_version }}
      IN_LT_PREVIA: ${{ inputs.lt_version_previa }}
    steps:
      - name: Checkout del SHA autorizado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Descargar release verificado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-verificado-${{ inputs.sha }}
          path: release

      - name: Verificar integridad antes de desplegar
        run: |
          test -f release/nexum-backend-linux-arm64
          test "$(sha256sum release/nexum-backend-linux-arm64 | cut -d' ' -f1)" = "$IN_DIGEST"

      - name: Autenticacion OIDC sin credenciales estaticas
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cd-backend-${{ inputs.sha }}
          aws-region: us-east-2

      - name: Verificar 2 nodos sanos antes de mutar y capturar estado previo
        run: |
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" > asg-antes.json
          python3 herramientas/estado_asg.py asg-antes.json \
            --minimo 2 --nodos 2 --salida estado-previo.json
          LT_ANTERIOR=$(jq -r '.launch_template_version' estado-previo.json)
          MAX_ANTERIOR=$(jq -r '.max_size' estado-previo.json)
          echo "lt_anterior=$LT_ANTERIOR max_anterior=$MAX_ANTERIOR"
          test "$MAX_ANTERIOR" -eq 2
          if [ -n "$IN_LT_PREVIA" ] && [ "$IN_LT_PREVIA" != "$LT_ANTERIOR" ]; then
            echo "LT_VERSION_PREVIA_NO_COINCIDE: input=$IN_LT_PREVIA real=$LT_ANTERIOR"
            exit 1
          fi
          echo "LT_ANTERIOR=$LT_ANTERIOR" >> "$GITHUB_ENV"

      - name: Verificar release en el Launch Template (I-020)
        run: |
          test -n "$ARTIFACT_BUCKET" || { echo "ARTIFACT_DELIVERY_BLOCKED: falta ARTIFACT_BUCKET"; exit 1; }
          aws ec2 describe-launch-template-versions \
            --launch-template-name "$LT_NAME" --versions "$IN_LT_VERSION" > lt.json
          python3 herramientas/verificar_lt_release.py lt.json \
            --bucket "$ARTIFACT_BUCKET" --release-id "$IN_RELEASE_ID" \
            --sha256 "$IN_DIGEST" --version "$IN_LT_VERSION"

      - name: Publicar binario en S3 de forma inmutable
        run: |
          test -n "$ARTIFACT_BUCKET" || { echo "ARTIFACT_DELIVERY_BLOCKED: falta ARTIFACT_BUCKET"; exit 1; }
          CLAVE="releases/$IN_RELEASE_ID/nexum-backend-linux-arm64"
          PUT=0
          aws s3api put-object \
            --bucket "$ARTIFACT_BUCKET" --key "$CLAVE" \
            --body release/nexum-backend-linux-arm64 \
            --checksum-algorithm SHA256 \
            --server-side-encryption AES256 \
            --if-none-match "*" > put.json || PUT=$?
          # El publicador es de SOLO ESCRITURA: la bucket policy le deniega s3:GetObject,
          # y HeadObject exige exactamente esa accion (AWS S3 API, HeadObject). Por eso
          # no se consulta el objeto con este rol: la verificacion se apoya en la respuesta
          # de PutObject (ChecksumSHA256) y en la inmutabilidad de la clave (If-None-Match).
          # Ante 412 se falla cerrado: sin una identidad verificadora aprobada no se puede
          # demostrar que el contenido preexistente coincida, y no se declara idempotencia.
          if [ "$PUT" -ne 0 ]; then
            echo "ARTIFACT_PUBLISH_CONFLICT: la clave ya existe (412) o la publicacion fallo (exit $PUT)."
            echo "Sin identidad verificadora aprobada no se acredita idempotencia; abortando."
            exit 1
          fi
          python3 herramientas/decidir_publicacion_s3.py \
            --put-exit "$PUT" --sha256 "$IN_DIGEST"
          python3 - <<'PY'
          import json
          import sys

          with open("put.json", encoding="utf-8") as manejador:
              respuesta = json.load(manejador)
          checksum = respuesta.get("ChecksumSHA256", "")
          if not checksum:
              sys.exit("PutObject no devolvio ChecksumSHA256: falla cerrado")
          print(f"checksum_s3={checksum}")
          PY

      - name: Comprobar 2 nodos sanos antes de mutar
        run: |
          SALUDABLES=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
            --query 'TargetHealthDescriptions' --output json \
            | jq '[.[] | select(.TargetHealth.State=="healthy")] | length')
          echo "healthy=$SALUDABLES"
          test "$SALUDABLES" -eq 2

      - name: Preparar capacidad transitoria (max 3 durante el rollout)
        run: |
          MAX=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].MaxSize' --output text)
          echo "max_size_actual=$MAX"
          test "$MAX" -eq 2
          touch .mutado
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" --max-size 3

      - name: Aplicar el Launch Template del release
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --launch-template LaunchTemplateName="$LT_NAME",Version="$IN_LT_VERSION"

      - name: Iniciar instance refresh (100% healthy, max 150%)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":150,"InstanceWarmup":120}'

      - name: Esperar el instance refresh
        run: |
          for _ in $(seq 1 60); do
            ESTADO=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "estado=$ESTADO"
            case "$ESTADO" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackInProgress|RollbackFailed) exit 1 ;;
            esac
            sleep 30
          done
          echo "Timeout esperando instance refresh"
          exit 1

      - name: Verificar 2 nodos sanos y release efectivo
        run: |
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" > asg-despues.json
          python3 herramientas/estado_asg.py asg-despues.json \
            --minimo 2 --nodos 2 --salida estado-despues.json
          SALUDABLES=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
            --query 'TargetHealthDescriptions' --output json \
            | jq '[.[] | select(.TargetHealth.State=="healthy")] | length')
          test "$SALUDABLES" -eq 2
          for ID in $(jq -r '.instance_ids[]' estado-despues.json); do
            aws ec2 describe-instance-attribute --instance-id "$ID" \
              --attribute userData --query 'UserData.Value' --output text
          done > userdata.txt
          python3 herramientas/verificar_instancias_release.py userdata.txt \
            --bucket "$ARTIFACT_BUCKET" --release-id "$IN_RELEASE_ID" \
            --sha256 "$IN_DIGEST" --instancias 2

      - name: Restaurar capacidad (max 2 tras el rollout)
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" --max-size 2

      - name: Prueba HTTP HTTPS de liveness
        run: |
          CODIGO=$(curl --silent --show-error --fail --proto '=https' \
            --output /dev/null --write-out '%{http_code}' \
            "$API_BASE_URL/api/v1/health/live")
          echo "GET /api/v1/health/live -> $CODIGO"
          test "$CODIGO" = "200"

      - name: Prueba HTTP HTTPS de readiness (obligatoria)
        run: |
          CODIGO=$(curl --silent --show-error --fail --proto '=https' \
            --output /dev/null --write-out '%{http_code}' \
            "$API_BASE_URL/api/v1/health/ready")
          echo "GET /api/v1/health/ready -> $CODIGO"
          test "$CODIGO" = "200"

      - name: Registrar evidencia de despliegue
        if: success()
        run: |
          python3 - "$IN_RELEASE_ID" "$IN_SHA" "$IN_DIGEST" "$IN_LT_VERSION" "$IN_LT_PREVIA" "$GITHUB_ACTOR" <<'PY'
          import json, sys, datetime
          release, sha, digest, lt, lt_previa, actor = sys.argv[1:7]
          datos = {
              "release_id": release,
              "sha": sha,
              "sha256_binario": digest,
              "desplegado_por": actor,
              "desplegado_en": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "entorno": "aws-deploy",
              "lt_version": lt,
              "lt_version_previa": lt_previa,
              "capacidad_transitoria_max": 3,
              "http_live": "200",
              "http_ready": "200",
              "estado": "EJECUTADO_NO_AWS_VERIFIED",
          }
          with open("evidencia-deploy.json", "w", encoding="utf-8") as f:
              json.dump(datos, f, indent=2, ensure_ascii=False)
          print(json.dumps(datos, ensure_ascii=False))
          PY

      - name: Publicar evidencia
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencia-deploy-${{ inputs.sha }}
          path: evidencia-deploy.json
          retention-days: 30
          if-no-files-found: error

      - name: Rollback seguro (cancela refresh activo, conserva capacidad)
        if: failure()
        run: |
          if [ ! -f .mutado ]; then
            echo "SIN_MUTACION_AWS: no se ejecuta rollback"
            exit 0
          fi
          echo "Iniciando rollback de la version previa: $LT_ANTERIOR"
          aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" > refreshes.json
          python3 herramientas/decidir_rollback.py refreshes.json --salida rollback.json
          ACCION=$(jq -r '.accion' rollback.json)
          REFRESH_ID=$(jq -r '.refresh_id // empty' rollback.json)
          case "$ACCION" in
            ROLLBACK_EN_PROGRESO)
              echo "Ya hay un rollback en progreso: $REFRESH_ID; se espera su resultado"
              ESPERANDO=1
              for _ in $(seq 1 40); do
                aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$ASG_NAME" > refreshes-actual.json
                RES=$(python3 herramientas/estado_refresh.py refreshes-actual.json \
                  --id "$REFRESH_ID" --espera recuperacion)
                case "$RES" in
                  RECUPERACION_OK) ESPERANDO=0; break ;;
                  RECUPERACION_FALLIDA) echo "ROLLBACK_FAILED: rollback previo fallido"; exit 1 ;;
                  ESPERAR) sleep 15 ;;
                  *) echo "ROLLBACK_BLOCKED_ACTIVE_REFRESH estado=$RES"; exit 1 ;;
                esac
              done
              if [ "$ESPERANDO" -ne 0 ]; then
                echo "ROLLBACK_BLOCKED_ACTIVE_REFRESH: timeout esperando rollback previo"
                exit 1
              fi
              ;;
            CANCELAR_Y_ESPERAR)
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME"
              CONFIRMADO=""
              for _ in $(seq 1 40); do
                aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$ASG_NAME" > refreshes-actual.json
                RES=$(python3 herramientas/estado_refresh.py refreshes-actual.json \
                  --id "$REFRESH_ID" --espera cancelacion)
                case "$RES" in
                  CANCELADO_OK|YA_TERMINADO) CONFIRMADO=1; break ;;
                  ESPERAR|ROLLBACK_EN_PROGRESO) sleep 15 ;;
                  *) echo "ROLLBACK_BLOCKED_ACTIVE_REFRESH estado=$RES"; exit 1 ;;
                esac
              done
              if [ -z "$CONFIRMADO" ]; then
                echo "ROLLBACK_BLOCKED_ACTIVE_REFRESH: timeout esperando cancelacion"
                exit 1
              fi
              ;;
            PROCEDER)
              echo "Sin refresh activo incompatible; se procede con el rollback"
              ;;
            *)
              echo "ROLLBACK_BLOCKED_ACTIVE_REFRESH: accion desconocida $ACCION"
              exit 1
              ;;
          esac
          # Mantener max 3 mientras se recupera: no restaurar 2 antes.
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" --max-size 3
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --launch-template LaunchTemplateName="$LT_NAME",Version="$LT_ANTERIOR"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":150,"InstanceWarmup":120}' > inicio-rollback.json
          REFRESH_RB=$(jq -r '.InstanceRefreshId' inicio-rollback.json)
          OK=""
          for _ in $(seq 1 60); do
            aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" > refreshes-rb.json
            RES=$(python3 herramientas/estado_refresh.py refreshes-rb.json \
              --id "$REFRESH_RB" --espera recuperacion)
            case "$RES" in
              RECUPERACION_OK) OK=1; break ;;
              RECUPERACION_FALLIDA) echo "ROLLBACK_FAILED: estado=$RES"; exit 1 ;;
              ESPERAR) sleep 30 ;;
              *) echo "ROLLBACK_FAILED: estado desconocido $RES"; exit 1 ;;
            esac
          done
          if [ -z "$OK" ]; then
            echo "ROLLBACK_FAILED: timeout esperando recuperacion; max_size=3 conservado"
            exit 1
          fi
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" > asg-rollback.json
          python3 herramientas/estado_asg.py asg-rollback.json \
            --minimo 2 --nodos 2 --salida estado-rollback.json
          VERSION=$(jq -r '.launch_template_version' estado-rollback.json)
          test "$VERSION" = "$LT_ANTERIOR" || { echo "ROLLBACK_FAILED: LT no restaurada ($VERSION != $LT_ANTERIOR)"; exit 1; }
          SALUDABLES=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
            --query 'TargetHealthDescriptions' --output json \
            | jq '[.[] | select(.TargetHealth.State=="healthy")] | length')
          test "$SALUDABLES" -eq 2 || { echo "ROLLBACK_FAILED: targets=$SALUDABLES"; exit 1; }
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" --max-size 2
          echo "ROLLBACK_OK: version previa restaurada con 2 nodos sanos"
