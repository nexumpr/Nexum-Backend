name: Go Backend CI

# CI funcional del Backend Go (A-100 / A-110).
# Sin AWS, sin Docker, sin secretos productivos, sin despliegue.
# Herramientas fijadas a versiones verificadas con `go list -m -versions`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  calidad:
    name: Formato, vet, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go (version del go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar formato (gofmt)
        run: |
          fuera="$(gofmt -l cmd internal pkg tests)"
          if [ -n "$fuera" ]; then
            echo "Archivos sin gofmt:"
            echo "$fuera"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1 -timeout 240s

      - name: go test -race (cmd y unitarios)
        run: go test -race ./cmd/... ./tests/unit/... -count=1 -timeout 420s

  seguridad:
    name: Analisis estatico y vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go (version del go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar integridad de modulos
        run: go mod verify

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: gosec (sin exclusiones)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet ./...

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (historial completo para el escaneo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gitleaks
        run: |
          go run github.com/zricethezav/gitleaks/v8/cmd/gitleaks@v8.30.1 \
            detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1

  cadena-suministro:
    name: SBOM de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go (version del go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generar SBOM (SPDX JSON)
        run: |
          go run github.com/anchore/syft/cmd/syft@v1.57.0 \
            dir:. -o spdx-json=sbom.spdx.json -q

      - name: Publicar SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 7
          if-no-files-found: error
