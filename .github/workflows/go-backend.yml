name: Go Backend CI

# CI funcional del Backend Go (A-100 / A-110 / I-080 / RFC-008).
# Sin AWS, sin Docker, sin secretos productivos, sin despliegue.
# Acciones fijadas por SHA de commit y herramientas por version exacta.
#
# Grafo (RFC-008): deteccion -> validaciones en paralelo -> quality-gate
#                  -> hardening-report -> CI Success.
# Contrato: sdd/_control/H08/MATRIZ_JOBS_CI.md y GATES_PR.md.

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]

# `actions: read` solo permite descargar los artefactos del propio run para el
# Quality Gate y el Hardening Report. No hay permisos de escritura ni credenciales.
permissions:
  contents: read
  actions: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  detectar:
    name: Deteccion de cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.perfil.outputs.go }}
      api: ${{ steps.perfil.outputs.api }}
      sdd: ${{ steps.perfil.outputs.sdd }}
      infra: ${{ steps.perfil.outputs.infra }}
      completo: ${{ steps.perfil.outputs.completo }}
    steps:
      - name: Checkout (historial completo para calcular el diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calcular perfil de cambios (fail-closed)
        id: perfil
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 herramientas/detectar_cambios_ci.py \
            --evento "$EVENTO" --base "$BASE" --head "$HEAD" \
            --salida "$GITHUB_OUTPUT"

  calidad:
    name: Formato, vet, build y pruebas
    needs: detectar
    if: ${{ !cancelled() && (needs.detectar.result != 'success' || needs.detectar.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go (version del go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar formato (gofmt)
        run: |
          fuera="$(gofmt -l cmd internal pkg tests)"
          if [ -n "$fuera" ]; then
            echo "Archivos sin gofmt:"
            echo "$fuera"
            echo "--- gofmt -d (diagnostico temporal autorizado; se retira antes del merge) ---"
            gofmt -d $fuera
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: go build reproducible (-trimpath -buildvcs)
        run: go build -trimpath -buildvcs=true ./...

      - name: Binario linux/arm64 para release
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=true \
            -o dist/nexum-backend-linux-arm64 ./cmd/server
          sha256sum dist/nexum-backend-linux-arm64 | tee dist/binario.sha256

      - name: Publicar binario para release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binario-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: go test
        run: go test ./... -count=1 -timeout 240s

      - name: go test -race (cmd, unitarios y seguridad)
        run: go test -race ./cmd/... ./tests/unit/... ./tests/security/... -count=1 -timeout 480s

      - name: Fuzzing acotado del binding HTTP
        run: |
          go test ./tests/unit/transport -run '^$' -fuzz '^FuzzBindJSON$' -fuzztime 20s

      - name: Cobertura del dominio (umbral 80%)
        run: |
          go test ./tests/... -coverpkg=all -coverprofile=coverage.out -count=1 -timeout 600s
          python3 herramientas/cobertura_dominio.py coverage.out --umbral 80

      - name: Publicar cobertura
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-${{ github.sha }}
          path: coverage.out
          retention-days: 7
          if-no-files-found: error

      - name: Evaluacion de mutation testing (decision determinista)
        run: python3 herramientas/evaluar_mutacion.py --json mutacion.json

      - name: Publicar evaluacion de mutacion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutacion-${{ github.sha }}
          path: mutacion.json
          retention-days: 7
          if-no-files-found: error

  seguridad:
    name: Analisis estatico y vulnerabilidades
    needs: detectar
    if: ${{ !cancelled() && (needs.detectar.result != 'success' || needs.detectar.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go (version del go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar integridad de modulos
        run: go mod verify

      - name: Inventario de dependencias
        run: go list -m all > dependencias.txt

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: gosec (sin exclusiones, código de producción)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet ./cmd/... ./internal/... ./pkg/...

      - name: gosec detecta el fixture vulnerable (prueba negativa)
        run: |
          RC=0
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet \
            ./tests/fixtures/security/gosecinseguro > gosec-fixture.txt 2>&1 || RC=$?
          python3 herramientas/verificar_fixture_gosec.py gosec-fixture.txt "$RC"

      - name: Publicar inventario de dependencias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependencias-${{ github.sha }}
          path: dependencias.txt
          retention-days: 7
          if-no-files-found: error

  secretos:
    name: Escaneo de secretos
    needs: detectar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (historial completo para el escaneo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gitleaks
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 \
            detect --source . --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json --no-banner --redact --exit-code 1

  iac:
    name: Validacion Terraform e IaC
    needs: detectar
    if: ${{ !cancelled() && (needs.detectar.result != 'success' || needs.detectar.outputs.infra == 'true' || needs.detectar.outputs.sdd == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Terraform (version fijada)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra/terraform

      - name: bootstrap init -backend=false
        working-directory: infra/terraform/bootstrap
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tf-bootstrap
        run: terraform init -backend=false -input=false

      - name: bootstrap validate
        working-directory: infra/terraform/bootstrap
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tf-bootstrap
        run: terraform validate

      - name: entorno init -backend=false
        working-directory: infra/terraform/envs/h08i
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tf-env
        run: terraform init -backend=false -input=false

      - name: entorno validate
        working-directory: infra/terraform/envs/h08i
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tf-env
        run: terraform validate

      - name: Instalar Trivy (version fijada)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Escaneo de seguridad IaC (Trivy HIGH/CRITICAL)
        run: |
          trivy config --quiet \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            infra/terraform

      - name: Escaneo DevSecOps de IaC (SG/IAM/S3/state)
        run: python3 herramientas/verificar_iac_devsecops.py --json iac-devsecops.json

      - name: Publicar hallazgos DevSecOps de IaC
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-devsecops-${{ github.sha }}
          path: iac-devsecops.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Prueba negativa del escaner IaC
        run: |
          rc=0
          trivy config --quiet \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output "$RUNNER_TEMP/trivy-fixture.json" \
            tests/fixtures/iac/inseguro || rc=$?
          python3 herramientas/verificar_fixture_iac.py "$RUNNER_TEMP/trivy-fixture.json" "$rc"

      - name: Vigencia de la excepcion RFC-006
        run: python3 herramientas/verificar_vigencia_rfc006.py

      - name: Terraform test del módulo de observabilidad
        working-directory: infra/terraform/modules/observabilidad
        env:
          TF_DATA_DIR: ${{ runner.temp }}/tf-test-observabilidad
        run: |
          terraform init -backend=false -input=false
          terraform test

      - name: Evidencia de drills I-140 (Go)
        run: |
          go test -count=1 -v ./tests/unit/transport/... -run '^(TestHTTPServerStatusesAndErrors)$'
          go test -count=1 -v ./tests/unit/financial/... -run '^(TestGoalReversionPreservesInvariant|TestIdempotencyManagerBehavior)$'
          go test -count=1 -v ./tests/unit/security/... -run '^(TestRefreshTokenReplayFamilyRevocation)$'
          go test -count=1 -v ./tests/unit/telemetry/... -run '^(TestReadinessProbeDegradation503)$'

      - name: Evidencia de drills I-140 (Python)
        run: python3 -m unittest herramientas.tests.test_cd_helpers.DecisionRollback -v

      - name: Dependencias de herramientas (fijadas)
        run: python3 -m pip install --disable-pip-version-check -r herramientas/requirements.txt

      - name: Pruebas de contrato Terraform e IaC
        run: python3 -m unittest discover -s tests/infra/terraform

      - name: Regresion FinOps de infraestructura
        run: python3 -m unittest discover -s tests/infra/finops

      - name: Contratos del operador de encendido/apagado I-120
        run: python3 -m unittest discover -s tests/infra/operacion

      - name: Controles de respaldo y restauracion I-130
        run: python3 -m unittest discover -s tests/infra/respaldo

      - name: Contratos de publicacion y compatibilidad I-150
        run: python3 -m unittest discover -s tests/infra/publicacion

  contratos:
    name: Contratos OpenAPI y herramientas
    needs: detectar
    if: ${{ !cancelled() && (needs.detectar.result != 'success' || needs.detectar.outputs.api == 'true' || needs.detectar.outputs.sdd == 'true' || needs.detectar.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (historia completa para comparar con main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dependencias de herramientas (fijadas)
        run: python3 -m pip install --disable-pip-version-check -r herramientas/requirements.txt

      - name: Validacion OpenAPI H06
        run: python3 sdd/03-endpoints/herramientas/validar_h06.py

      - name: Compatibilidad de contrato (breaking changes)
        run: |
          set -euo pipefail
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "::error::No se pudo resolver origin/main; la comparacion falla cerrada."
            exit 2
          fi
          git show origin/main:sdd/03-endpoints/openapi/nexum-api-v1.json > "$RUNNER_TEMP/contrato-base.json"
          # El registro de excepciones de API (I-150) solo admite rupturas cubiertas por
          # una autorizacion humana acotada: RFC aprobada, codigo, ruta, metodo y vigencia.
          # Cualquier otra ruptura, en E001 o en los otros 74 contratos, sigue fallando.
          python3 herramientas/comparar_contrato_api.py \
            --base "$RUNNER_TEMP/contrato-base.json" \
            --actual sdd/03-endpoints/openapi/nexum-api-v1.json \
            --excepciones sdd/_control/H08/EXCEPCIONES_COMPATIBILIDAD_API.json

      - name: Pruebas de herramientas y validadores
        run: python3 -m unittest discover -s herramientas/tests

      - name: Contrato del propio CI (grafo y documentos)
        run: python3 -m unittest discover -s tests/infra/ci

  cadena-suministro:
    name: SBOM de dependencias
    needs: detectar
    if: ${{ !cancelled() && (needs.detectar.result != 'success' || needs.detectar.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go (version del go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generar SBOM (SPDX JSON)
        run: |
          go run github.com/anchore/syft/cmd/syft@v1.57.0 \
            dir:. -o spdx-json=sbom.spdx.json -q

      - name: Publicar SBOM como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 7
          if-no-files-found: error

  sast-semgrep:
    name: SAST Semgrep
    needs: detectar
    if: ${{ !cancelled() && (needs.detectar.result != 'success' || needs.detectar.outputs.go == 'true' || needs.detectar.outputs.sdd == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar Semgrep (version fijada)
        run: python3 -m pip install --disable-pip-version-check "semgrep==1.184.0"

      - name: Semgrep SAST sobre el codigo (hallazgos bloqueantes)
        run: |
          semgrep --config herramientas/semgrep/nexum.yml \
            --metrics=off --disable-version-check \
            --severity ERROR --error \
            --json --output semgrep.json \
            cmd internal pkg tests/unit tests/security tests/integration
          python3 - <<'PY'
          import json

          with open("semgrep.json", encoding="utf-8") as manejador:
              datos = json.load(manejador)
          escaneados = datos.get("paths", {}).get("scanned", [])
          print(f"archivos escaneados por Semgrep: {len(escaneados)}")
          if len(escaneados) < 5:
              raise SystemExit("el escaneo SAST no alcanzo archivos: falla cerrado")
          PY

      - name: Publicar hallazgos SAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-${{ github.sha }}
          path: semgrep.json
          retention-days: 7
          if-no-files-found: error

      - name: Semgrep detecta el fixture inseguro (prueba negativa)
        run: |
          rc=0
          semgrep --config herramientas/semgrep/nexum.yml \
            --metrics=off --disable-version-check \
            --severity ERROR --error \
            --json --output "$RUNNER_TEMP/semgrep-fixture.json" \
            herramientas/semgrep/fixtures/inseguro || rc=$?
          python3 herramientas/verificar_fixture_semgrep.py "$RUNNER_TEMP/semgrep-fixture.json" "$rc"

  integracion:
    name: Integracion HTTP y concurrencia
    needs: detectar
    if: ${{ !cancelled() && (needs.detectar.result != 'success' || needs.detectar.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go (version del go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pruebas de integracion de capas reales (con -race)
        run: |
          set -o pipefail
          go test -race ./tests/integration/... -count=1 -timeout 300s -v | tee integracion.txt

      - name: Binario real arrancado y sondeado por TCP
        run: |
          set -euo pipefail
          go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/nexum-server" ./cmd/server
          "$RUNNER_TEMP/nexum-server" > "$RUNNER_TEMP/servidor.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null; :' EXIT
          listo=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/health/live; then
              listo=1
              break
            fi
            sleep 0.5
          done
          if [ "$listo" -ne 1 ]; then
            echo "::error::El binario no respondio /api/v1/health/live en 30 s"
            cat "$RUNNER_TEMP/servidor.log"
            exit 1
          fi
          codigo_404="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/ruta-inexistente)"
          codigo_405="$(curl -s -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/health/live)"
          codigo_ready="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/health/ready)"
          {
            echo "binario: vivo y escuchando en 127.0.0.1:8080"
            echo "GET /api/v1/health/live = 200"
            echo "GET /api/v1/ruta-inexistente = $codigo_404"
            echo "POST /api/v1/health/live = $codigo_405"
            echo "GET /api/v1/health/ready = $codigo_ready (503 esperado: sin dependencias registradas)"
          } | tee -a integracion.txt
          if [ "$codigo_404" != "404" ]; then
            echo "::error::Se esperaba 404 y se obtuvo $codigo_404"
            exit 1
          fi
          if [ "$codigo_405" != "405" ]; then
            echo "::error::Se esperaba 405 y se obtuvo $codigo_405"
            exit 1
          fi
          if [ "$codigo_ready" != "503" ]; then
            echo "::error::Se esperaba 503 (readiness sin dependencias) y se obtuvo $codigo_ready"
            exit 1
          fi

      - name: Publicar evidencia de integracion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integracion-${{ github.sha }}
          path: integracion.txt
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: PR Quality Gate
    needs:
      - detectar
      - calidad
      - seguridad
      - secretos
      - iac
      - contratos
      - cadena-suministro
      - sast-semgrep
      - integracion
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Descargar artefactos del run
        if: ${{ needs.calidad.result == 'success' || needs.seguridad.result == 'success' || needs.iac.result == 'success' || needs['cadena-suministro'].result == 'success' || needs['sast-semgrep'].result == 'success' || needs.integracion.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artefactos

      - name: Reconstruir contexto del gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PERFIL_GO: ${{ needs.detectar.outputs.go }}
          PERFIL_API: ${{ needs.detectar.outputs.api }}
          PERFIL_SDD: ${{ needs.detectar.outputs.sdd }}
          PERFIL_INFRA: ${{ needs.detectar.outputs.infra }}
          PERFIL_COMPLETO: ${{ needs.detectar.outputs.completo }}
        run: |
          set -euo pipefail
          mkdir -p artefactos
          python3 - <<'PY'
          import json
          import os

          perfil = {
              clave: os.environ.get(f"PERFIL_{clave.upper()}", "false") == "true"
              for clave in ("go", "api", "sdd", "infra", "completo")
          }
          with open("perfil.json", "w", encoding="utf-8") as manejador:
              json.dump(perfil, manejador)
          with open("needs.json", "w", encoding="utf-8") as manejador:
              manejador.write(os.environ["NEEDS_JSON"])
          PY

      - name: Evaluar Quality Gate (falla cerrado)
        run: |
          python3 herramientas/quality_gate_ci.py \
            --needs needs.json --perfil perfil.json \
            --artefactos artefactos --sha "$GITHUB_SHA" \
            --json quality-gate.json --resumen "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultado del gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-gate-${{ github.sha }}
          path: quality-gate.json
          retention-days: 7
          if-no-files-found: ignore

  hardening-report:
    name: Hardening Report
    needs:
      - detectar
      - calidad
      - seguridad
      - secretos
      - iac
      - contratos
      - cadena-suministro
      - sast-semgrep
      - integracion
      - quality-gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Descargar artefactos del run
        if: ${{ needs.calidad.result == 'success' || needs.seguridad.result == 'success' || needs.iac.result == 'success' || needs['cadena-suministro'].result == 'success' || needs['sast-semgrep'].result == 'success' || needs.integracion.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artefactos

      - name: Generar Hardening Report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PERFIL_GO: ${{ needs.detectar.outputs.go }}
          PERFIL_API: ${{ needs.detectar.outputs.api }}
          PERFIL_SDD: ${{ needs.detectar.outputs.sdd }}
          PERFIL_INFRA: ${{ needs.detectar.outputs.infra }}
          PERFIL_COMPLETO: ${{ needs.detectar.outputs.completo }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p artefactos
          python3 - <<'PY'
          import json
          import os

          perfil = {
              clave: os.environ.get(f"PERFIL_{clave.upper()}", "false") == "true"
              for clave in ("go", "api", "sdd", "infra", "completo")
          }
          with open("perfil.json", "w", encoding="utf-8") as manejador:
              json.dump(perfil, manejador)
          with open("needs.json", "w", encoding="utf-8") as manejador:
              manejador.write(os.environ["NEEDS_JSON"])
          PY
          python3 herramientas/hardening_report.py \
            --needs needs.json --perfil perfil.json \
            --artefactos artefactos --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" --pr "${PR_NUMERO:-}" \
            --salida reporte --resumen "$GITHUB_STEP_SUMMARY"

      - name: Publicar Hardening Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardening-report-${{ github.sha }}
          path: reporte/
          retention-days: 7
          if-no-files-found: ignore

  ci-success:
    name: CI Success
    needs:
      - quality-gate
      - hardening-report
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado final
        env:
          GATE: ${{ needs.quality-gate.result }}
          REPORTE: ${{ needs.hardening-report.result }}
        run: |
          set -euo pipefail
          echo "quality-gate=$GATE"
          echo "hardening-report=$REPORTE"
          if [ "$GATE" != "success" ] || [ "$REPORTE" != "success" ]; then
            echo "::error::CI SUCCESS no se puede declarar (quality-gate=$GATE, hardening-report=$REPORTE)"
            exit 1
          fi
          echo "CI SUCCESS: todos los controles obligatorios y el reporte estan en orden."
